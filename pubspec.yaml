name: chatx
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  dash_chat_2: ^0.0.21
  flutter_tts : ^4.2.3
  path_provider: ^2.1.6
  image_picker: ^1.1.2
  mime: ^2.0.0
  file_picker: ^10.2.3
  loading_animation_widget: ^1.3.0
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  google_sign_in: ^7.2.0
  razorpay_flutter: ^1.4.5
  url_launcher: ^6.3.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/chatx.png"
  min_sdk_android: 21


  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/google.png
    - assets/chatx.png

